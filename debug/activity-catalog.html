<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>NALVI · Galería técnica del catálogo de actividades</title>
  <link rel="stylesheet" href="../assets/css/kuaa-activity-components.css">
  <link rel="stylesheet" href="../assets/css/nalvi-design-system.css">
  <link rel="stylesheet" href="../assets/css/nalvi-activity-catalog.css">
  <style>
    :root{color-scheme:light;--gallery-ink:#17213d;--gallery-muted:#65708d;--gallery-line:#dfe4f0;--gallery-bg:#f5f7fb}
    *{box-sizing:border-box}body{margin:0;background:var(--gallery-bg);color:var(--gallery-ink);font-family:Nunito,system-ui,sans-serif}.gallery-shell{width:min(1240px,calc(100% - 32px));margin:auto}.gallery-head{position:sticky;z-index:10;top:0;padding:18px 0;background:color-mix(in srgb,var(--gallery-bg) 92%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--gallery-line)}.gallery-head .gallery-shell{display:flex;align-items:center;justify-content:space-between;gap:20px}.gallery-brand{display:flex;align-items:center;gap:12px}.gallery-mark{display:grid;place-items:center;width:44px;height:44px;border-radius:13px;background:linear-gradient(145deg,#235e9d,#078f85);color:#fff;font-size:22px;font-weight:950}.gallery-brand h1{margin:0;font-size:clamp(19px,3vw,28px)}.gallery-brand p{margin:2px 0 0;color:var(--gallery-muted);font-size:13px}.gallery-controls{display:flex;gap:9px;align-items:center}.gallery-controls select{min-height:44px;padding:0 12px;border:1px solid var(--gallery-line);border-radius:12px;background:#fff;font:inherit;font-weight:800}.gallery-summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:24px auto}.summary-card{padding:15px;border:1px solid var(--gallery-line);border-radius:16px;background:#fff}.summary-card b{display:block;font-size:22px}.summary-card span{color:var(--gallery-muted);font-size:13px}.gallery-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;padding-bottom:60px}.catalog-demo{display:grid;grid-template-rows:auto 1fr;background:#fff;border:1px solid var(--gallery-line);border-radius:24px;overflow:hidden;box-shadow:0 12px 28px rgba(33,48,85,.07)}.catalog-demo__head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 17px;border-bottom:1px solid var(--gallery-line)}.catalog-demo__head h2{margin:0;font-size:16px}.validation-badge{padding:5px 9px;border-radius:99px;background:#e7f8f2;color:#08745c;font-size:11px;font-weight:900}.validation-badge.is-invalid{background:#ffe9eb;color:#a53143}.catalog-demo__viewport{padding:18px;min-width:0}.catalog-demo__result{min-height:26px;margin-top:9px;color:var(--gallery-muted);font-size:13px;font-weight:800}.catalog-demo__tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.catalog-demo__tools button{min-height:44px;padding:8px 12px;border:1px solid var(--gallery-line);border-radius:11px;background:#fff;color:var(--gallery-ink);font:inherit;font-weight:800;cursor:pointer}.catalog-demo .kuaa-activity{padding:20px}.gallery-note{grid-column:1/-1;padding:18px;border-radius:18px;background:#e9eefc;color:#243d7f}.gallery-note strong{display:block;margin-bottom:4px}.gallery-mobile-preview{max-width:390px;margin:auto;border:8px solid #26324e;border-radius:30px;overflow:hidden;background:#fff}.gallery-mobile-preview .catalog-demo__viewport{padding:12px}.gallery-mobile-preview .kuaa-activity{padding:17px}.gallery-mobile-preview .nalvi-choice-grid,.gallery-mobile-preview .nalvi-image-choice,.gallery-mobile-preview .nalvi-sort-categories{grid-template-columns:1fr}
    @media(max-width:840px){.gallery-grid{grid-template-columns:1fr}.gallery-summary{grid-template-columns:repeat(2,minmax(0,1fr))}.gallery-head .gallery-shell{align-items:flex-start;flex-direction:column}.gallery-controls{width:100%}.gallery-controls select{flex:1}}
  </style>
</head>
<body>
  <header class="gallery-head">
    <div class="gallery-shell">
      <div class="gallery-brand"><span class="gallery-mark">N</span><div><h1>Catálogo oficial de actividades NALVI</h1><p>Vista técnica local · no forma parte de la experiencia del estudiante</p></div></div>
      <div class="gallery-controls"><label for="galleryLocale">Idioma de interfaz</label><select id="galleryLocale"><option value="es">Español</option><option value="en">English</option><option value="pt">Português</option><option value="fr">Français</option><option value="it">Italiano</option><option value="de">Deutsch</option></select></div>
    </div>
  </header>
  <main class="gallery-shell">
    <section class="gallery-summary" id="gallerySummary"></section>
    <section class="gallery-grid" id="catalogGallery"><p>Cargando componentes…</p></section>
  </main>
  <script src="../assets/js/kuaa-activity-renderer.js"></script>
  <script type="module" src="../assets/js/nalvi-activity-catalog-renderer.mjs"></script>
  <script type="module" src="./activity-catalog.mjs"></script>
</body>
</html>
